<header class="topnav" role="banner">
  <a class="topnav__brand" href="{{ url_for('index') }}" aria-label="IP Clem home">
    <img src="{{ url_for('static', filename='favicon.ico') }}" alt="" width="28" height="28">
    <span class="topnav__brand-text">IP Clem</span>
  </a>

  <button
    id="themeToggle"
    class="theme-toggle"
    type="button"
    aria-label="Color theme"
  >
    <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 14.5A8.5 8.5 0 1110.5 3a7 7 0 0010.5 11.5z"/>
      </svg>
    </span>
    <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2M12 19.5v2M4.7 4.7l1.4 1.4M17.9 17.9l1.4 1.4M2.5 12h2M19.5 12h2M4.7 19.3l1.4-1.4M17.9 6.1l1.4-1.4"/>
      </svg>
    </span>
  </button>
</header>
